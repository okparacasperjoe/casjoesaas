name: Build Casjoe Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-apk.yml'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          sed -i -e 's/\r$//' mobile/android/gradlew
          chmod +x mobile/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: casjoe-app-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
