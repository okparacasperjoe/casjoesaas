<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Casjoe</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000066;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 166, 0, 0.2);
      border-top-color: #FFA600;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px; font-weight: 800; }
    p { margin: 0; opacity: 0.7; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Connecting to Casjoe...</h2>
  <p>Loading your executive workspace</p>
  <script>
    // Redirect to live SaaS platform if not redirected by Capacitor config
    setTimeout(function() {
      window.location.href = 'https://app.casjoe.com/dashboard';
    }, 1500);
  </script>
</body>
</html>
